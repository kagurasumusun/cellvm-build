# Windows CE full toolchain build (cellvm-build)
#
# Consumes four submodules:
#   llvm-project   (kagurasumusun/llvm-project @ llvm-wince)  compiler side
#   wince-crt      (kagurasumusun/wince-crt @ main)           Akari CRT: startup + data globals
#   wince-api      (kagurasumusun/wince-api @ main)           WinCE API headers + doc-derived import libs
#   pthread-win32  (kagurasumusun/pthread-win32 @ master)     static thread lib (gated, see below)
#
# The 2026-09 stack replaces the retired CeGCC-lineage pair (mingwrt +
# w32api; their upstream repositories are gone) with the in-house pair:
# wince-crt is the PE/COFF startup layer (deliberately not a C library
# -- see its include/akari/crt.h scope note), wince-api is the
# documented API surface written from the official Microsoft CE docs.
# The C library itself comes from the LLVM runtimes in Stage 3
# (llvm-libc for C, libc++ for C++), not from wince-crt.
#
# Pipeline (every push, plus workflow_dispatch):
#   Stage 1: host LLVM/Clang/LLD + WinCE lit tests (from llvm-project)
#   Stage 2 gates: wince-api host check + crosscheck (fresh clang),
#                  wince-crt host check + parser self-test
#   Stage 2: sysroot (build-wince-sysroot.sh: wince-crt + wince-api +
#            driver-compat installs; C-library extras gated)
#   Stage 3: compiler-rt builtins (required) + end-to-end link smoke
#            through the bare driver default line; libunwind/libc++abi/
#            libc++ gated on the wince-crt C library layer
#   Packaging + install/compile sanity check
#   Stage 4: unmodified TECLIB/glpi-wince-agent (their Makefile)      [gated*]
#   Stage 5: MaxSignal/Player 0.6.2.3-wince (official zip, overlay)   [gated*]
#
# * The C-library gate: pthread/gmon/posix extras (Stage 2), the C++
#   runtime stack (Stage 3) and the two third-party application stages
#   (4/5) all need a C library under them.  The C library is the LLVM
#   runtimes' job (llvm-libc; WinCE support not yet buildable), so
#   until Stage 3 can install it into the sysroot (marker:
#   <sysroot>/include/stdlib.h) those steps report "skipped (pending
#   the C library)" instead of failing.  A Win32-API-only program links
#   and runs through the bare driver line today.
#
# Caching keeps the hot loop fast: ccache and the Ninja build directory are
# restored by key and resumed incrementally, so a small fix after a prior run
# only recompiles what changed.

name: cellvm-build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellvm-${{ github.ref }}

env:
  TARGET: arm-pc-wince
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_NOHASHDIR: "true"

jobs:
  build:
    name: WinCE full toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake python3 python3-psutil zlib1g-dev gcc g++ make \
            lld ccache zstd mold unzip pkg-config autoconf automake libtool

          if ! command -v ld.mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/local/bin/ld.mold
          fi

          echo "ccache: $(ccache --version | head -1)"
          echo "ninja: $(ninja --version)"
          echo "nproc=$(nproc)  mem=$(free -h | awk '/Mem/{print $2}')"
          echo "submodule pins:"
          git submodule status

      # -----------------------------------------------------------------
      # Caching
      # -----------------------------------------------------------------

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('llvm-project/clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Restore Ninja build dir
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build
          key: ninja-${{ runner.os }}-${{ hashFiles('llvm-project/clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}
          restore-keys: ninja-${{ runner.os }}-

      # -----------------------------------------------------------------
      # Stage 1: host LLVM/Clang/LLD + tools + WinCE lit tests
      # -----------------------------------------------------------------

      - name: "Stage 1: configure (WinCE cache)"
        run: |
          ccache -z

          cmake -G Ninja -S llvm-project/llvm -B build \
            -C llvm-project/clang/cmake/caches/WinCE.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install/wince-llvm" \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON

          echo "ccache stats before build:"
          ccache -s

      - name: "Stage 1: build clang + lld + tools"
        run: |
          cmake --build build --target clang lld llc \
            llvm-ar llvm-ranlib llvm-dlltool llvm-nm llvm-mc llvm-readobj \
            llvm-objdump llvm-objcopy llvm-rc llvm-config llvm-pdbutil \
            llvm-symbolizer \
            FileCheck split-file not count

          BIN=build/bin
          [ -e "$BIN/clang-cl" ] || ln -sf clang "$BIN/clang-cl"
          [ -e "$BIN/lld-link" ] || ln -sf lld "$BIN/lld-link"
          test -x "$BIN/llvm-lit"

          echo "ccache stats after build:"
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('llvm-project/clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}

      - name: Save Ninja build dir
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build
          key: ninja-${{ runner.os }}-${{ hashFiles('llvm-project/clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}

      - name: "Stage 1 diagnostics: symbolized x86 crash + thumbv7 personality"
        # Diagnostic only: reports exit statuses and dumps backtraces, never
        # propagates a failure, and cannot mask or block the lit gate below.
        continue-on-error: true
        run: |
          set +e
          BIN="$PWD/build/bin"
          export LLVM_SYMBOLIZER_PATH="$BIN/llvm-symbolizer"
          LL="$PWD/llvm-project/llvm/test/CodeGen/ARM/wince-pdata-every-function.ll"
          TMP="$(mktemp -d)"
          : > "$TMP/empty.ll"
          printf 'define i32 @f() {\nentry:\n  ret i32 0\n}\n' > "$TMP/f.ll"
          printf 'int f(void) { return 0; }\n' > "$TMP/plain.c"
          W="-Wno-wince-sysroot-missing"

          echo "===== A0. llvm-symbolizer present? ====="
          if [ -x "$BIN/llvm-symbolizer" ]; then
            echo "  yes: $BIN/llvm-symbolizer"
          else
            echo "  NO - backtraces will stay unsymbolized"
          fi

          echo "===== A1. symbolized backtrace: llc -mtriple=i386-pc-wince ====="
          echo "----- one-function module, -filetype=asm -----"
          "$BIN/llc" -mtriple=i386-pc-wince -filetype=asm "$TMP/f.ll" -o "$TMP/f.s" 2>&1 | sed -n '1,70p'
          echo "----- EMPTY module, -filetype=asm -----"
          "$BIN/llc" -mtriple=i386-pc-wince -filetype=asm "$TMP/empty.ll" -o "$TMP/e.s" 2>&1 | sed -n '1,70p'
          echo "----- one-function module, -filetype=obj -----"
          "$BIN/llc" -mtriple=i386-pc-wince -filetype=obj "$TMP/f.ll" -o "$TMP/f.o" 2>&1 | sed -n '1,70p'
          echo "----- one-function module, -filetype=null -----"
          "$BIN/llc" -mtriple=i386-pc-wince -filetype=null "$TMP/f.ll" -o /dev/null 2>&1 | sed -n '1,70p'
          echo "  rc=$?"

          echo "===== A2. bracket the crash: -stop-after each late pass ====="
          for P in finalize-isel pre-ra-machine-scheduler machine-cp prologepilog \
                   pre-sched2 branch-folder x86-frame-lowering; do
            out="$("$BIN/llc" -mtriple=i386-pc-wince -stop-after="$P" -o /dev/null "$TMP/f.ll" 2>&1)"
            rc=$?
            note=""
            [ $rc -ne 0 ] && note="$(printf '%s\n' "$out" | grep -m1 -E 'PLEASE submit|error:|Unknown' | cut -c1-88)"
            printf '  rc=%-4s -stop-after=%-26s %s\n' "$rc" "$P" "$note"
          done
          echo "----- and the same on the working control triple -----"
          for P in finalize-isel prologepilog branch-folder; do
            out="$("$BIN/llc" -mtriple=i386-pc-win32 -stop-after="$P" -o /dev/null "$TMP/f.ll" 2>&1)"
            printf '  rc=%-4s i386-pc-win32 -stop-after=%s\n' "$?" "$P"
          done
          "$BIN/llc" -mtriple=i386-pc-win32 -filetype=asm "$TMP/f.ll" -o /dev/null 2>&1 | sed -n '1,6p'
          echo "  rc=$? (control: full asm output on i386-pc-win32)"

          echo "===== A3. clang -c with a symbolized backtrace ====="
          "$BIN/clang" -target i386-pc-wince $W -c "$TMP/plain.c" -o "$TMP/plain.o" 2>&1 | sed -n '1,70p'
          echo "  rc=$?"

          echo "===== B. cpp_func frame per triple: is the loss v7-specific or Thumb-specific? ====="
          echo "# thumbv7 loses .personality/.handlerdata AND the whole landing pad"
          echo "# (.Lfunc_begin0, the .Ltmp* EH_LABELs, the %lpad block, __cxa_end_cleanup"
          echo "# and the LSDA), while armv5te and thumbv5te keep all of it.  armv7 is the"
          echo "# discriminator: if armv7 also loses it, the cause is the v7 architecture"
          echo "# version; if armv7 keeps it, the cause is Thumb."
          for T in armv5te thumbv5te armv7 thumbv7; do
            echo "----- $T-pc-wince -----"
            "$BIN/llc" -mtriple="$T-pc-wince" -o - "$LL" 2>/dev/null \
              | sed -n '/^cpp_func:/,/^seh_func:/p' > "$TMP/$T.txt"
            for pat in '.personality' '.handlerdata' 'GCC_except_table' '.Lfunc_begin0' \
                       'EH_LABEL' '%lpad' '__cxa_end_cleanup' '.cantunwind' '.fnstart' '.fnend'; do
              printf '  %-22s %s\n' "$pat" "$(grep -cF -- "$pat" "$TMP/$T.txt")"
            done
          done

          echo "===== C. does cpp_func keep its landing pad through instruction selection? ====="
          for T in thumbv5te thumbv7; do
            echo "----- $T-pc-wince : MIR after finalize-isel, cpp_func -----"
            "$BIN/llc" -mtriple="$T-pc-wince" -stop-after=finalize-isel -o - "$LL" 2>/dev/null \
              | awk '/^name:[ ]*cpp_func/{f=1} f&&/^\.\.\.$/{exit} f' > "$TMP/$T.mir"
            echo "  MIR lines: $(wc -l < "$TMP/$T.mir")"
            for pat in 'EH_LABEL' 'landingpad' 'LandingPad' 'invoke' 'resume' 'personality'; do
              printf '  %-14s %s\n' "$pat" "$(grep -cE -- "$pat" "$TMP/$T.mir")"
            done
            echo "  --- first 22 MIR lines ---"
            sed -n '1,22p' "$TMP/$T.mir"
          done
          echo "===== D. which ARM feature level loses the landing pad? ====="
          echo "# armv5te and thumbv5te keep cpp_func's landing pad; armv7 and thumbv7"
          echo "# lose it entirely, so the discriminator is the architecture version and"
          echo "# not Thumb.  Sweep versions to bracket the threshold.  The input IR is"
          echo "# triple-independent, so every row gets the same landing pad in."
          echo "  input IR: landingpad=$(grep -c 'landingpad' "$LL") personality=$(grep -c 'personality' "$LL") invoke=$(grep -c 'invoke' "$LL")"
          for T in armv4 armv4t armv5 armv5te armv6 armv6k armv6m armv6t2 armv7 armv7a armv7r armv7m armv8a thumbv4t thumbv6 thumbv7 thumbv8a; do
            "$BIN/llc" -mtriple="$T-pc-wince" -o - "$LL" > "$TMP/sweep.txt" 2>/dev/null
            printf '  %-10s .personality=%-2s GCC_except_table=%-2s .handlerdata=%-2s Ltmp=%-3s cantunwind=%s\n' \
              "$T" "$(grep -c '^\.personality' "$TMP/sweep.txt")" "$(grep -c 'GCC_except_table' "$TMP/sweep.txt")" \
              "$(grep -c '^\.handlerdata' "$TMP/sweep.txt")" "$(grep -c 'Ltmp' "$TMP/sweep.txt")" \
              "$(grep -c 'cantunwind' "$TMP/sweep.txt")"
          done

          echo "===== E. is it the architecture version or the CPU derived from it? ====="
          echo "# With no -mcpu, Triple::getARMCPUForArch picks one per architecture"
          echo "# version, so the sweep above changes both at once.  Cross them."
          printf '  %-22s %-12s .personality=%s\n' 'armv5te-pc-wince' 'cortex-a8' \
            "$("$BIN/llc" -mtriple=armv5te-pc-wince -mcpu=cortex-a8 -o - "$LL" 2>/dev/null | grep -c '^\.personality')"
          printf '  %-22s %-12s .personality=%s\n' 'armv7-pc-wince' 'arm10tdmi' \
            "$("$BIN/llc" -mtriple=armv7-pc-wince -mcpu=arm10tdmi -o - "$LL" 2>/dev/null | grep -c '^\.personality')"
          printf '  %-22s %-12s .personality=%s\n' 'armv7-pc-wince' 'arm1136j-s' \
            "$("$BIN/llc" -mtriple=armv7-pc-wince -mcpu=arm1136j-s -o - "$LL" 2>/dev/null | grep -c '^\.personality')"
          printf '  %-22s %-12s .personality=%s\n' 'armv7-pc-wince' 'generic' \
            "$("$BIN/llc" -mtriple=armv7-pc-wince -mcpu=generic -o - "$LL" 2>/dev/null | grep -c '^\.personality')"
          printf '  %-22s %-12s .personality=%s\n' 'armv5te-pc-wince' 'generic' \
            "$("$BIN/llc" -mtriple=armv5te-pc-wince -mcpu=generic -o - "$LL" 2>/dev/null | grep -c '^\.personality')"

          echo "===== F. does the optimization level matter for armv7? ====="
          for O in 0 1 2 3; do
            "$BIN/llc" -mtriple=armv7-pc-wince -O"$O" -o - "$LL" > "$TMP/o$O.txt" 2>/dev/null
            printf '  -O%s .personality=%-2s GCC_except_table=%-2s Ltmp=%-3s\n' "$O" \
              "$(grep -c '^\.personality' "$TMP/o$O.txt")" "$(grep -c 'GCC_except_table' "$TMP/o$O.txt")" \
              "$(grep -c 'Ltmp' "$TMP/o$O.txt")"
          done

          echo "===== G. is seh_func, a WinEH function in the same module, what flips armv7? ====="
          echo "# cpp_func is trivial - one invoke, a cleanup landing pad and a resume -"
          echo "# and nothing in it is arch-dependent.  seh_func next to it uses catchswitch"
          echo "# and catchpad, i.e. Windows EH.  Compile cpp_func alone to separate them."
          printf '%s\n' \
            'declare i32 @__gxx_personality_v0(...)' \
            'declare void @may_crash()' \
            'define i32 @cpp_func(i32 %x) personality ptr @__gxx_personality_v0 {' \
            'entry:' \
            '  invoke void @may_crash() to label %cont unwind label %lpad' \
            'cont:' \
            '  ret i32 %x' \
            'lpad:' \
            '  %lp = landingpad { ptr, i32 }' \
            '          cleanup' \
            '  resume { ptr, i32 } %lp' \
            '}' > "$TMP/only-cpp.ll"
          for T in armv5te thumbv5te armv7 thumbv7; do
            "$BIN/llc" -mtriple="$T-pc-wince" -o - "$TMP/only-cpp.ll" > "$TMP/only-$T.s" 2> "$TMP/only-$T.err"
            printf '  %-10s .personality=%-2s GCC_except_table=%-2s cantunwind=%-2s Ltmp=%-3s err=%s\n' \
              "$T" "$(grep -c '^\.personality' "$TMP/only-$T.s")" "$(grep -c 'GCC_except_table' "$TMP/only-$T.s")" \
              "$(grep -c 'cantunwind' "$TMP/only-$T.s")" "$(grep -c 'Ltmp' "$TMP/only-$T.s")" \
              "$(head -c 110 "$TMP/only-$T.err" | tr '\n' ' ')"
          done

          echo "===== H. cpp_func MIR after finalize-isel: armv5te (works) vs armv7 (loses it) ====="
          echo "# 82 vs 64 lines and 3 vs 0 EH_LABELs, so the landing pad is already gone"
          echo "# before the AsmPrinter runs.  These bodies show what ISel kept."
          for T in armv5te armv7; do
            echo "----- $T-pc-wince -----"
            "$BIN/llc" -mtriple="$T-pc-wince" -stop-after=finalize-isel -o - "$LL" 2>/dev/null \
              | awk '/^name:[ ]*cpp_func/{f=1} f&&/^\.\.\.$/{exit} f' | tail -n +23
          done
          echo "===== I. which pass removes cpp_func's landing pad on armv7? ====="
          echo "# The last run bracketed it: with cpp_func alone, armv5te/thumbv5te emit an"
          echo "# LSDA and 8 .Ltmp references and armv7/thumbv7 emit none, so the WinEH"
          echo "# function beside it is not involved; and on armv7 -O0 keeps the LSDA while"
          echo "# -O1/-O2/-O3 lose it, so an IR pass is responsible.  The version sweep puts"
          echo "# the boundary at hasV6Ops() && !isThumb1Only().  This table reduces"
          echo "# -print-after-all to one row per dump: the first Y->n flip names the pass."
          for T in armv5te armv7; do
            echo "----- $T-pc-wince -O2 -----"
            "$BIN/llc" -mtriple="$T-pc-wince" -O2 -print-after-all -o /dev/null "$TMP/only-cpp.ll" 2>&1 | awk '
              /^\*\*\* (IR|MIR) Dump /{
                if (n != "") printf "  %-60s personality=%s landingpad=%s EH_LABEL=%s\n", n, (p?"Y":"n"), (l?"Y":"n"), (e?"Y":"n")
                n=substr($0,5,60); p=0; l=0; e=0; next }
              /personality/{p=1} /landingpad/{l=1} /EH_LABEL/{e=1}
              END{ if (n != "") printf "  %-60s personality=%s landingpad=%s EH_LABEL=%s\n", n, (p?"Y":"n"), (l?"Y":"n"), (e?"Y":"n") }' | head -120
          done
          echo "--- and the pass pipeline itself, for reference ---"
          "$BIN/llc" -mtriple=armv7-pc-wince -O2 -debug-pass=Structure -o /dev/null "$TMP/only-cpp.ll" 2>&1 | head -70

          echo "===== diagnostics done ====="



      - name: "Stage 1: WinCE lit tests"
        run: |
          set +e

          # Every path below is asserted to exist before lit runs, and the number of
          # tests lit discovers is asserted to equal the number of files listed.  Both
          # checks are needed because lit treats a bad path as a warning, not an error:
          # it prints "input ... contained no tests" and still exits 0, so the gate
          # silently loses coverage.  CI 33765390258 did exactly that -
          # wince-pdata-every-function.ll was listed under clang/test/CodeGen/ARM/ when
          # it lives in llvm/test/CodeGen/ARM/, so 37 listed inputs produced "Passed: 36"
          # and the step went green.  The path is corrected here, and the four tests
          # that existed but were never listed are added: clang/test/Driver/wince-x86.c,
          # clang/test/CodeGen/ARM/wince-cxx-eh-pdata.cpp, and the two lld COMDAT cases
          # wince-exidx-comdat.s / wince-pdata-comdat.s.  All 41 entries are now the
          # complete set of WinCE tests in the tree (verified by walking the clang/test,
          # lld/test and llvm/test git trees without truncation: 15 + 16 + 10 paths,
          # minus lld/test/COFF/Inputs/*.s and the wince-range-thunk-thumb-check.py
          # helper, plus the three ms-* extension tests that do not carry "wince" in
          # their names).
          WINCE_TESTS=(
            llvm-project/clang/test/Driver/wince.c
            llvm-project/clang/test/Driver/wince-unsupported-arch.c
            llvm-project/clang/test/Driver/wince-x86.c
            llvm-project/clang/test/Preprocessor/wince-version-macros.c
            llvm-project/clang/test/CodeGen/wince-seh.c
            llvm-project/clang/test/CodeGen/wince-x86-seh.c
            llvm-project/clang/test/CodeGen/ARM/wince-ehabi-tables.c
            llvm-project/clang/test/CodeGen/ARM/wince-global-ctors.c
            llvm-project/clang/test/CodeGen/ARM/wince-literal-pool.c
            llvm-project/clang/test/CodeGen/ARM/wince-seh-ehabi-mixed.c
            llvm-project/clang/test/CodeGen/ARM/wince-seh-scope-table.c
            llvm-project/clang/test/CodeGen/ARM/wince-codeview.c
            llvm-project/clang/test/CodeGen/ARM/wince-cpp-abi.cpp
            llvm-project/clang/test/CodeGen/ARM/wince-cpp-ttype-encoding.cpp
            llvm-project/clang/test/CodeGen/ARM/wince-cxx-eh-pdata.cpp
            llvm-project/clang/test/Parser/ms-pragmas-full.c
            llvm-project/clang/test/Parser/ms-extern.c
            llvm-project/clang/test/Sema/ms-extern.c
            llvm-project/lld/test/COFF/wince-arm-relocs.s
            llvm-project/lld/test/COFF/wince-ctors.s
            llvm-project/lld/test/COFF/wince-exidx-bounds.s
            llvm-project/lld/test/COFF/wince-exidx-comdat.s
            llvm-project/lld/test/COFF/wince-exidx-sort.s
            llvm-project/lld/test/COFF/wince-image.s
            llvm-project/lld/test/COFF/wince-pdata-comdat.s
            llvm-project/lld/test/COFF/wince-pdata.test
            llvm-project/lld/test/COFF/wince-pdb.test
            llvm-project/lld/test/COFF/wince-range-thunk.s
            llvm-project/lld/test/COFF/wince-range-thunk-thumb.s
            llvm-project/lld/test/COFF/wince-thumb-bit.s
            llvm-project/lld/test/COFF/wince-thunk.s
            llvm-project/llvm/test/MC/ARM/wince-coff-relocs.s
            llvm-project/llvm/test/MC/ARM/wince-exidx.s
            llvm-project/llvm/test/MC/ARM/wince-seh-pdata.s
            llvm-project/llvm/test/MC/ARM/wince-armasm.s
            llvm-project/llvm/test/MC/ARM/wince-armasm-labels.s
            llvm-project/llvm/test/MC/ARM/wince-armasm-data.s
            llvm-project/llvm/test/MC/ARM/wince-armasm-cond.s
            llvm-project/llvm/test/CodeGen/ARM/wince-pdata-every-function.ll
            llvm-project/llvm/test/CodeGen/ARM/wince-seh-parent-frame.ll
            llvm-project/llvm/test/CodeGen/ARM/wince-soft-float.ll
          )

          MISSING=""
          for t in "${WINCE_TESTS[@]}"; do
            [ -f "$t" ] || MISSING="$MISSING $t"
          done
          if [ -n "$MISSING" ]; then
            echo "===== WinCE lit gate: listed test files do not exist:$MISSING ====="
            exit 1
          fi

          OUT=$(
            ./build/bin/llvm-lit -sv --timeout 900 "${WINCE_TESTS[@]}" 2>&1
          )
          RC=$?
          echo "$OUT"
          set -e

          if [ $RC -ne 0 ]; then
            echo "===== WinCE lit gate FAILED (rc=$RC) ====="
            exit $RC
          fi

          NPASS=$(echo "$OUT" | sed -n 's/.*Passed: \([0-9]\+\).*/\1/p' | tail -1)
          if [ "${NPASS:-0}" -ne "${#WINCE_TESTS[@]}" ]; then
            echo "===== WinCE lit gate: ${#WINCE_TESTS[@]} files listed but ${NPASS:-0} passed ====="
            echo "      (a test that was skipped or contained no RUN lines is a gap, not a pass)"
            exit 1
          fi
      - name: "Install (isolated prefix)"
        run: |
          cmake --build build --target \
            install-clang install-clang-resource-headers install-lld

          BIN="$PWD/install/wince-llvm/bin"
          mkdir -p "$BIN"

          for t in clang clang++ clang-cl lld ld.lld lld-link \
                   llvm-ar llvm-ranlib llvm-dlltool llvm-lib llvm-nm llvm-mc \
                   llvm-readobj llvm-objdump llvm-objcopy llvm-strip llvm-rc \
                   llvm-windres llvm-config llvm-pdbutil; do
            if [ -e "build/bin/$t" ] || [ -L "build/bin/$t" ]; then
              cp -a "build/bin/$t" "$BIN/"
            fi
          done

          [ -e "$BIN/clang++" ] || ln -sf clang "$BIN/clang++"
          [ -e "$BIN/clang-cl" ] || ln -sf clang "$BIN/clang-cl"
          [ -e "$BIN/lld-link" ] || ln -sf lld "$BIN/lld-link"

          ls -l "$BIN"

      # -----------------------------------------------------------------
      # Stage 2: the in-house stack's own gates, run with the fresh clang
      # -----------------------------------------------------------------

      - name: "Stage 2 gates: wince-api host check + defcheck"
        run: make -C wince-api check

      - name: "Stage 2 gates: wince-api crosscheck (fresh clang, 6 WinCE targets)"
        run: |
          make -C wince-api crosscheck WINCECLANG="$PWD/install/wince-llvm/bin/clang"

      - name: "Stage 2 gates: wince-crt host check + parser self-test"
        run: make -C wince-crt check

      # -----------------------------------------------------------------
      # Stage 2: sysroot
      # -----------------------------------------------------------------

      - name: "Stage 2: assemble sysroot"
        run: |
          sh build-wince-sysroot.sh \
            --toolchain "$PWD/install/wince-llvm/bin" \
            --target "$TARGET" \
            --prefix "$PWD/install/wince-llvm/wince-sysroot" \
            --jobs "$(nproc)"

      - name: "Stage 2: smoke-check"
        run: |
          CLANG="$PWD/install/wince-llvm/bin/clang"
          SYSROOT="$PWD/install/wince-llvm/wince-sysroot"

          # No link here yet: the driver names libclang_rt.builtins-<arch>.a
          # unconditionally and Stage 3 has not built it.  Compile-only, plus
          # the installed-sysroot view: the documented header spellings
          # (wince-api M100: one file per header, its documented name, no
          # forwarder aliases) must compile through --sysroot.
          printf 'int __attribute__((constructor)) c(void){return 0;}\nint main(void){return 0;}\n' \
            > smoke.c
          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -c smoke.c -o smoke.o
          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -### smoke.c -o smoke.exe 2>&1 | head -20

          # both documented spellings that exist as real files: the
          # MSVC-cased primary (Windows.h) and a lowercase-documented
          # header (aygshell.h -- its 46 documented rows spell it so)
          printf '#include <Windows.h>\nint main(void){ return (int)sizeof(SYSTEMTIME); }\n' > smoke-case1.c
          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -fsyntax-only smoke-case1.c
          printf '#include <aygshell.h>\nint main(void){ return 0; }\n' > smoke-case2.c
          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -fsyntax-only smoke-case2.c
          echo "smoke: documented-spelling includes compile through the sysroot"

      - name: "Stage 2: driver-default link proof (builtins stand-in)"
        # Verifies everything except the real builtins content: the bare
        # driver line must pick up crt3.o (Akari), libmingw32.a (= libakari.a),
        # the placeholder archives and the doc-derived libcoredll.a, and link
        # EXE(WinMain)/EXE(main)/DLL images.  An empty builtins archive stands
        # in for Stage 3 (the real one is smoke-tested right after it builds).
        run: |
          CLANG="$PWD/install/wince-llvm/bin/clang"
          BIN="$PWD/install/wince-llvm/bin"
          SYSROOT="$PWD/install/wince-llvm/wince-sysroot"
          "$BIN/llvm-ar" rcs "$SYSROOT/lib/libclang_rt.builtins-arm.a"

          printf '#include <Windows.h>\nint WINAPI WinMain(HINSTANCE h, HINSTANCE p, LPWSTR cmd, int show){ Sleep(1); return (int)(GetTickCount() & 7); }\n' > smoke-gui.c
          printf '#include <Windows.h>\nint main(void){ return (int)(GetTickCount() & 3); }\n' > smoke-main.c
          printf '#include <Windows.h>\nBOOL WINAPI DllMain(HINSTANCE h, DWORD r, LPVOID rsv){ return TRUE; }\n__declspec(dllexport) int Triple(int x){ return 3*x; }\n' > smoke-dll.c

          for s in gui main; do
            "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -o smoke-$s.exe smoke-$s.c
            "$BIN/llvm-readobj" -h smoke-$s.exe | grep -q "IMAGE_FILE_MACHINE_ARM"
            "$BIN/llvm-readobj" -h smoke-$s.exe | grep -q "IMAGE_SUBSYSTEM_WINDOWS_CE_GUI"
          done
          "$BIN/llvm-readobj" --coff-imports smoke-gui.exe | grep -q "Name: coredll.dll"

          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -shared -o smoke-dll.dll smoke-dll.c
          "$BIN/llvm-readobj" -h smoke-dll.dll | grep -q "IMAGE_FILE_MACHINE_ARM"
          "$BIN/llvm-readobj" --coff-exports smoke-dll.dll | grep -q "Name: Triple"

          # The real builtins replace the stand-in in the next step.
          rm "$SYSROOT/lib/libclang_rt.builtins-arm.a"
          echo "driver-default link proof: EXE(WinMain) + EXE(main) + DLL OK"

      - name: "Stage 3: runtimes"
        run: |
          bash build-wince-runtimes.sh \
            --toolchain "$PWD/install/wince-llvm/bin" \
            --sysroot "$PWD/install/wince-llvm/wince-sysroot" \
            --target "$TARGET" \
            --build-dir "$PWD/build-wince-runtimes"

      - name: "Stage 3: end-to-end link smoke (real builtins, bare driver line)"
        # The same three images as the Stage 2 stand-in proof, now against the
        # real compiler-rt builtins archive -- and a division, which the ARM
        # backend lowers to __aeabi_idiv, proving the builtins content itself.
        run: |
          CLANG="$PWD/install/wince-llvm/bin/clang"
          BIN="$PWD/install/wince-llvm/bin"
          SYSROOT="$PWD/install/wince-llvm/wince-sysroot"
          test -s "$SYSROOT/lib/libclang_rt.builtins-arm.a"

          printf '#include <Windows.h>\nvolatile int a = 17, b = 5;\nint WINAPI WinMain(HINSTANCE h, HINSTANCE p, LPWSTR cmd, int show){ Sleep(1); return a / b; }\n' > smoke-gui.c
          printf '#include <Windows.h>\nvolatile int a = 17, b = 5;\nint main(void){ return a / b; }\n' > smoke-main.c
          printf '#include <Windows.h>\nBOOL WINAPI DllMain(HINSTANCE h, DWORD r, LPVOID rsv){ return TRUE; }\n__declspec(dllexport) int Triple(int x){ return 3 * x; }\n' > smoke-dll.c

          for s in gui main; do
            "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -o smoke-$s.exe smoke-$s.c
            "$BIN/llvm-readobj" -h smoke-$s.exe | grep -q "IMAGE_FILE_MACHINE_ARM"
            "$BIN/llvm-readobj" -h smoke-$s.exe | grep -q "IMAGE_SUBSYSTEM_WINDOWS_CE_GUI"
            "$BIN/llvm-readobj" --coff-imports smoke-$s.exe | grep -q "Name: coredll.dll"
          done
          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -shared -o smoke-dll.dll smoke-dll.c
          "$BIN/llvm-readobj" --coff-exports smoke-dll.dll | grep -q "Name: Triple"
          echo "end-to-end: EXE(WinMain) + EXE(main) + DLL with real builtins OK"

      - name: "Stage 3: C++ header-collision smoke (gated)"
        run: |
          CLANG="$PWD/install/wince-llvm/bin/clang"
          SYSROOT="$PWD/install/wince-llvm/wince-sysroot"

          # The C++ runtime stack is gated on the wince-crt C library layer
          # (see build-wince-runtimes.sh); the header-collision smoke needs
          # libc++'s headers to mean anything.
          if [ ! -d "$SYSROOT/include/c++/v1" ]; then
            echo "skipped: libc++ not built (pending the wince-crt C library layer)"
            exit 0
          fi

          # every libc++ header a windows.h TU is likely to pull, in the
          # order third-party code actually uses (windows chain first)
          cat > smoke-cxx.cpp <<'EOF'
          #include <windows.h>
          #include <functional>
          #include <string>
          #include <map>
          #include <memory>
          #include <queue>
          std::function<int(int)> g;
          int main() {
            std::string s("ok");
            std::map<int, std::string> m;
            std::queue<char> q;
            auto p = std::make_unique<int>(1);
            m[1] = s; q.push('x');
            return g ? 0 : (*p == 1 ? 0 : 1);
          }
          EOF
          sed -i 's/^          //' smoke-cxx.cpp
          "$CLANG" --target="$TARGET" --sysroot="$SYSROOT" -x c++ -c smoke-cxx.cpp -o smoke-cxx.o

      - name: "Stage 3: CodeView debug smoke-check"
        run: |
          CLANG="$PWD/install/wince-llvm/bin/clang"
          BIN="$PWD/install/wince-llvm/bin"

          printf 'int add(int a, int b){return a+b;}\nint main(void){return add(1,2)-3;}\n' > smoke-cv.c
          # CodeView is what lld embeds; -g alone is DWARF CFI (.debug_frame) on
          # this target, so ask for -gcodeview explicitly (the driver then passes
          # -debug to lld-link because the -g_Group match is not -g0).
          "$CLANG" --target="$TARGET" -g -gcodeview -c smoke-cv.c -o smoke-cv.obj
          "$BIN/llvm-objdump" -h smoke-cv.obj | tee smoke-cv.obj.sections
          # The object must carry the CodeView subsections. Single quotes
          # keep "$S" from being expanded to an empty shell variable, which
          # silently relaxed the pattern to '.debug' (the false-green bug:
          # it once matched the DWARF .debug_frame section in the object).
          grep -qF '.debug$S' smoke-cv.obj.sections
          grep -qF '.debug$T' smoke-cv.obj.sections
          "$CLANG" --target="$TARGET" -g -gcodeview -o smoke-cv.exe smoke-cv.c
          "$BIN/llvm-objdump" -h smoke-cv.exe | tee smoke-cv.sections
          # lld-link -debug consumes the .debug$* subsections and writes a
          # standalone PDB next to the image (default name: <exe>.pdb); the
          # sections themselves do not remain in the image (verified on the
          # linked CE image: only .text/.rdata/.data/.ctors/.dtors/.ARM.exi/
          # .ARM.ext). Verify the PDB instead: it must exist and hold the
          # public symbols (format per lld/test/COFF/wince-pdb.test).
          test -s smoke-cv.pdb
          "$BIN/llvm-pdbutil" dump -publics smoke-cv.pdb | tee smoke-cv.pdb.publics
          grep -qF 'main' smoke-cv.pdb.publics
          grep -qF 'add' smoke-cv.pdb.publics
          echo "CodeView verified: .debug\$S/.debug\$T in the object, standalone smoke-cv.pdb with public symbols"

      # -----------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------

      - name: "Package (isolated install + target-prefixed wrappers)"
        run: |
          PREFIX="$PWD/install/wince-llvm"
          BIN="$PREFIX/bin"

          for t in clang clang++ gcc g++ cc c++ ld.lld; do
            if [ -e "$BIN/$t" ] || [ -L "$BIN/$t" ]; then
              ln -sf "$t" "$BIN/arm-pc-wince-$t"
            fi
          done

          for t in lld-link llvm-ar llvm-ranlib llvm-dlltool llvm-nm \
                   llvm-mc llvm-readobj llvm-objdump; do
            [ -e "$BIN/$t" ] && ln -sf "$t" "$BIN/arm-pc-wince-$t"
          done

          TAR="wince-llvm-$TARGET-${{ runner.os }}-${{ github.sha }}.tar.zst"

          tar --zstd -cf "$TAR" -C install wince-llvm
          sha256sum "$TAR" > "$TAR.sha256"

      - name: "Package sanity: install to /opt and compile"
        run: |
          TAR=$(ls wince-llvm-*.tar.zst | head -1)

          sudo tar --zstd -xf "$TAR" -C /opt

          "$PWD/install/wince-llvm/bin/clang" --target="$TARGET" \
            -### -o /tmp/hi.exe /dev/null 2>&1 | head -5

      # -----------------------------------------------------------------
      # Stage 4: unmodified third-party WinCE application
      # TECLIB/glpi-wince-agent (GPLv2). Their Makefile, their sources.
      # -----------------------------------------------------------------

      - name: "Stage 4: TECLIB/glpi-wince-agent (unmodified, gated)"
        run: |
          SYSROOT="$PWD/install/wince-llvm/wince-sysroot"
          if [ ! -e "$SYSROOT/include/stdlib.h" ]; then
            echo "skipped: glpi-wince-agent needs the C library (llvm-libc,"
            echo "        Stage 3; marker $SYSROOT/include/stdlib.h absent)"
            exit 0
          fi
          PREFIX="$PWD/install/wince-llvm"
          BIN="$PREFIX/bin"
          [ -e "$BIN/clang++" ] || ln -sf clang "$BIN/clang++"
          [ -e "$BIN/llvm-windres" ] || ln -sf llvm-rc "$BIN/llvm-windres"
          sh bind-cegcc-names.sh "$BIN"
          export PATH="$BIN:$PATH"

          echo "CeGCC-named tools:"
          ls -l "$BIN"/arm-mingw32ce-*
          arm-mingw32ce-gcc --version | head -1

          SRC="$RUNNER_TEMP/glpi-wince-agent"
          # Pin the upstream commit. Fetch that SHA only; do not patch.
          mkdir -p "$SRC"
          git -C "$SRC" init
          git -C "$SRC" remote add origin \
            https://github.com/TECLIB/glpi-wince-agent.git
          git -C "$SRC" fetch --depth 1 origin \
            eb88be1a8224d731f255a9c4aae56c9812f6cc20
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = \
            eb88be1a8224d731f255a9c4aae56c9812f6cc20
          git -C "$SRC" status --porcelain

          # Their Makefile. Do not patch the tree.
          make -C "$SRC" -j"$(nproc)"

          EXE="$SRC/src/glpi-wince-agent.exe"
          test -s "$EXE"
          llvm-readobj --file-headers "$EXE"
          llvm-objdump -h "$EXE" | head -40

          # Stage products for upload (RUNNER_TEMP is not an artifact).
          DEST="$PWD/products/glpi-wince-agent"
          mkdir -p "$DEST"
          cp -a "$EXE" "$DEST/"
          for f in glpi-wince-agent-setup.dll glpi-wince-agent-service.dll; do
            [ -f "$SRC/src/$f" ] && cp -a "$SRC/src/$f" "$DEST/"
          done
          llvm-readobj --file-headers "$EXE" \
            > "$DEST/glpi-wince-agent.exe.headers.txt"
          {
            echo "upstream: TECLIB/glpi-wince-agent"
            echo "commit: eb88be1a8224d731f255a9c4aae56c9812f6cc20"
            echo "unmodified: yes (their Makefile, no patches)"
            echo "toolchain: ${{ github.sha }}"
            echo "target: $TARGET"
            echo
            sha256sum "$DEST"/* || true
          } > "$DEST/SHA256SUMS"

      # -----------------------------------------------------------------
      # Stage 5: MaxSignal/Player 0.6.2.3-wince (official zip).
      # Overlay LLVM/Clang Makefile only. No Player C++ patches. No audio.
      # -----------------------------------------------------------------

      - name: "Stage 5: MaxSignal/Player 0.6.2.3-wince (no audio, gated)"
        run: |
          SYSROOT="$PWD/install/wince-llvm/wince-sysroot"
          if [ ! -e "$SYSROOT/include/stdlib.h" ]; then
            echo "skipped: EasyRPG Player needs the C library (llvm-libc) and libc++"
            echo "        (Stage 3; marker $SYSROOT/include/stdlib.h absent)"
            exit 0
          fi
          PREFIX="$PWD/install/wince-llvm"
          BIN="$PREFIX/bin"
          [ -e "$BIN/clang++" ] || ln -sf clang "$BIN/clang++"
          [ -e "$BIN/llvm-windres" ] || ln -sf llvm-rc "$BIN/llvm-windres"
          sh bind-cegcc-names.sh "$BIN"
          export PATH="$BIN:$PATH"
          export PREFIX="$PWD/install/wince-easyrpg-deps"
          export DEST="$PWD/products/easyrpg-player"
          export WORK="$RUNNER_TEMP/easyrpg-wince"
          export JOBS="$(nproc)"
          export SYSROOT_INC="$PWD/install/wince-llvm/wince-sysroot/include"
          export PLAYER_PDB=1
          sh build-easyrpg-player.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## WinCE toolchain products"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- target: \`$TARGET\`"
            echo
            if ls wince-llvm-*.tar.zst >/dev/null 2>&1; then
              echo "### Toolchain"
              echo
              echo '```'
              ls -l wince-llvm-*.tar.zst*
              sha256sum wince-llvm-*.tar.zst
              echo '```'
            fi
            if [ -d products/glpi-wince-agent ]; then
              echo
              echo "### TECLIB/glpi-wince-agent (unmodified)"
              echo
              echo '```'
              ls -l products/glpi-wince-agent
              cat products/glpi-wince-agent/SHA256SUMS
              echo '```'
            fi
            if [ -d products/easyrpg-player ]; then
              echo
              echo "### MaxSignal/Player 0.6.2.3-wince (no audio, Makefile overlay)"
              echo
              echo '```'
              ls -l products/easyrpg-player
              cat products/easyrpg-player/SHA256SUMS
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wince-llvm-${{ env.TARGET }}-${{ runner.os }}
          path: |
            wince-llvm-*.tar.zst
            wince-llvm-*.tar.zst.sha256
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload glpi-wince-agent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glpi-wince-agent-${{ env.TARGET }}
          path: products/glpi-wince-agent/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload easyrpg-player
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easyrpg-player-${{ env.TARGET }}
          path: products/easyrpg-player/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cellvm-build-logs-${{ runner.os }}
          path: |
            build-wince-sysroot/**/*.log
            build-wince-runtimes/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish the exe artifacts on a rolling release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*${{ env.TARGET }}*'
      - name: Publish (rolling tag wince-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag=wince-latest
          # Flatten the downloaded artifact trees and drop meta files.
          mkdir -p pub
          find dist -type f \( -name '*.exe' -o -name '*.pdb' \
              -o -name 'wince-llvm-*.tar.zst' -o -name 'wince-llvm-*.tar.zst.sha256' \
              -o -name 'SHA256SUMS' \) -exec cp -v {} pub/ \;
          ls -l pub
          notes=$(printf 'Rolling artifacts from cellvm-build main @ %s\n\n- easyrpg-player.exe / easyrpg-player.pdb\n- glpi-wince-agent\n- wince-llvm toolchain tarball\n\nBuilt by GitHub Actions; see the workflow run for logs.' "${GITHUB_SHA::8}")
          repo="$GITHUB_REPOSITORY"
          gh release delete "$tag" --repo "$repo" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" \
            --title "WinCE toolchain artifacts (${GITHUB_SHA::8})" \
            --notes "$notes"
          gh release upload "$tag" --repo "$repo" pub/* --clobber
          gh release view "$tag" --repo "$repo"
